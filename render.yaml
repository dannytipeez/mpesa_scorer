services:
  - type: web
    name: mpesa-scorer
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MPESA_ENVIRONMENT
        value: production
      - key: MPESA_SHORTCODE
        value: "5008412"
      - key: MPESA_TILL_NUMBER
        value: "4466556"
      - key: MPESA_PAYMENT_AMOUNT
        value: "50"
      - key: MPESA_TRANSACTION_TYPE
        value: CustomerBuyGoodsOnline
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_CALLBACK_URL
        sync: false
